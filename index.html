<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Product Manager</span>

            <div class="d-flex gap-2">
                <select id="sortSelect" class="form-select" style="width:auto;" onchange="handleSort()">
                    <option value="default">Sort By...</option>
                    <option value="price">Price (Low-High)</option>
                    <option value="name">Name (A-Z)</option>
                    <option value="id">ID (Newest)</option>
                </select>

                <input type="number" id="filterStart" class="form-control" placeholder="Start ID" style="width: 100px;">
                <input type="number" id="filterEnd" class="form-control" placeholder="End ID" style="width: 100px;">
                <button class="btn btn-outline-light" onclick="applyFilter()">Filter</button>
                <button class="btn btn-outline-warning" onclick="resetFilter()">Reset</button>
            </div>
        </div>
    </nav>

    <div class="container">

        <div class="d-flex justify-content-end mb-3">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#productModal" onclick="prepareCreate()">
                + Add New Product
            </button>
        </div>

        <div id="productContainer" class="row row-cols-1 row-cols-md-3 g-4">

        </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="editPid"> <div class="mb-3">
                            <label class="form-label">Product Name</label>
                            <input type="text" class="form-control" id="inputName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="url" class="form-control" id="inputImage" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" class="form-control" id="inputPrice" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="inputDesc" rows="3"></textarea>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="handleFormSubmit()">Save Product</button>
                </div>

            </div>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
